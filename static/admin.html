<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Control Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/admin.css" rel="stylesheet">
</head>
<body>
  <header class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand"><i class="bi bi-cpu"></i> AI Control Center</span>
    <span id="header-status" class="badge text-bg-secondary">Loading</span>
  </header>
  <div class="container-fluid">
    <div class="row">
      <aside class="col-lg-2 border-end min-vh-100 p-3 bg-light">
        <nav class="nav nav-pills flex-column gap-1">
          <a class="nav-link active" href="#dashboard">Dashboard</a>
          <a class="nav-link" href="#models">Models</a>
          <a class="nav-link" href="#prompts">Prompts</a>
          <a class="nav-link" href="#rag">RAG</a>
          <a class="nav-link" href="#performance">Performance</a>
          <a class="nav-link" href="#guardrails">Guardrails</a>
          <a class="nav-link" href="#system">System</a>
        </nav>
      </aside>
      <main class="col-lg-10 p-4">
        <div id="alert-area"></div>
        <section id="dashboard" class="admin-section">
          <div class="d-flex justify-content-between align-items-center mb-3"><h2>Dashboard</h2><button class="btn btn-outline-primary" id="refresh-btn"><i class="bi bi-arrow-clockwise"></i> Refresh</button></div>
          <div class="row g-3" id="health-cards"></div>
          <div class="card mt-4"><div class="card-header">Active configuration</div><div class="card-body" id="active-config">Loading…</div></div>
        </section>
        <section id="models" class="admin-section d-none"><h2>Model Configuration</h2><form data-section="models" class="config-form card card-body mt-3"><div class="row g-3">
          <div class="col-md-6"><label class="form-label">Primary provider</label><select class="form-select" name="primary_provider"></select></div>
          <div class="col-md-6"><label class="form-label">Primary model</label><select class="form-select" name="primary_model"></select></div>
          <div class="col-md-6"><label class="form-label">Fallback provider</label><select class="form-select" name="fallback_provider"><option value="">None</option></select></div>
          <div class="col-md-6"><label class="form-label">Fallback model</label><select class="form-select" name="fallback_model"><option value="">None</option></select></div>
          <div class="col-md-4"><label class="form-label">Temperature</label><input class="form-control" name="temperature" type="number" min="0" max="2" step="0.1"></div>
          <div class="col-md-4"><label class="form-label">Max tokens</label><input class="form-control" name="max_tokens" type="number" min="1" max="32768"></div>
          <div class="col-md-4"><label class="form-label">Request timeout (seconds)</label><input class="form-control" name="request_timeout" type="number" min="1" max="600"></div>
          <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" name="primary_enabled" type="checkbox"><label class="form-check-label">Primary model enabled</label></div><div class="form-check form-switch"><input class="form-check-input" name="fallback_enabled" type="checkbox"><label class="form-check-label">Fallback enabled</label></div></div>
        </div><button class="btn btn-primary mt-3 save-section">Save models</button></form></section>
        <section id="prompts" class="admin-section d-none"><h2>Prompt Configuration</h2><form data-section="prompts" class="config-form card card-body mt-3" id="prompt-form"></form></section>
        <section id="rag" class="admin-section d-none"><h2>RAG Configuration</h2><form data-section="rag" class="config-form card card-body mt-3"><div class="row g-3" id="rag-fields"></div><button class="btn btn-primary mt-3 save-section">Save RAG settings</button></form></section>
        <section id="performance" class="admin-section d-none"><h2>Performance Configuration</h2><form data-section="performance" class="config-form card card-body mt-3"><div class="row g-3" id="performance-fields"></div><button class="btn btn-primary mt-3 save-section">Save performance settings</button></form></section>
        <section id="guardrails" class="admin-section d-none"><h2>Guardrails</h2><form data-section="guardrails" class="config-form card card-body mt-3"><div class="row g-3" id="guardrail-fields"></div><button class="btn btn-primary mt-3 save-section">Save guardrails</button></form></section>
        <section id="system" class="admin-section d-none"><h2>System</h2><div class="card card-body mt-3"><p>Run a real test without applying edits to production.</p><div class="input-group"><input id="test-question" class="form-control" value="How do I create a ticket in VMS?"><button id="test-btn" class="btn btn-outline-primary">Test configuration</button></div><pre id="test-result" class="mt-3"></pre></div></section>
      </main>
    </div>
  </div>
  <script src="/static/admin.js"></script>
</body>
</html>
